services:
  db:
    image: postgres:16-alpine
    container_name: ticket_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: naresh9676
      POSTGRES_DB: ticket_booking_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticket_booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket_booking_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:naresh9676@db:5432/ticket_booking_platform?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-key-change-me-in-production"
      JWT_EXPIRES_IN: "7d"
      GOOGLE_CLIENT_ID: "mock-google-client-id"
      GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres_data:
  redis_data:
