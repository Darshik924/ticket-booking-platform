version: "3"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ticketBook-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: ticket_booking_db
    volumes:
      - postgres_ticketbook_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ticketBook-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_ticketbook_data:/data

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ticketBook-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_ticketbook_data:/prometheus
    # Explicitly enable the remote-write receiver flag required by k6
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:10.0.0
    container_name: ticketBook-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_ticketbook_data:/var/lib/grafana

volumes:
  postgres_ticketbook_data:
  redis_ticketbook_data:
  prometheus_ticketbook_data:
  grafana_ticketbook_data:
